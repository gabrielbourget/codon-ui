name: continuous_integration

on:
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  ACTIONLINT_VERSION: 1.7.12
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify_tooling_and_code:
    name: Verify Tooling And Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          ACTIONLINT_DIR="$RUNNER_TEMP/actionlint"
          mkdir -p "$ACTIONLINT_DIR"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$ACTIONLINT_DIR/actionlint.tar.gz"
          tar -xzf "$ACTIONLINT_DIR/actionlint.tar.gz" -C "$ACTIONLINT_DIR" actionlint
          chmod +x "$ACTIONLINT_DIR/actionlint"
          echo "$ACTIONLINT_DIR" >> "$GITHUB_PATH"
          "$ACTIONLINT_DIR/actionlint" -version

      - name: Verify GitHub Actions Files
        run: pnpm verify:github-actions

      - name: Verify Monorepo Tooling Integration
        run: pnpm verify:tooling

  build_surface:
    name: Build Surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify_tooling_and_code]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Verify Build Surface
        run: pnpm verify:build

  test_surface:
    name: Test Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify_tooling_and_code]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Verify Test Surface
        run: pnpm verify:tests
